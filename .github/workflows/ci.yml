name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
      - run: go build ./...
      - run: go test ./...
