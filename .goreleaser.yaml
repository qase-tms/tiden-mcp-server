version: 2

builds:
  - main: ./cmd/tiden-mcp-server
    binary: tiden-mcp-server
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/qase-tms/tiden-mcp-server/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "tiden-mcp-server_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: qase-tms
    name: tiden-mcp-server
  draft: false

changelog:
  use: git
  sort: asc
